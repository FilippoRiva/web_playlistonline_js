<!DOCTYPE html>
<html>
<link rel="stylesheet" type="text/css" href="css/login.css">
<script src="js/utils.js" async></script>
<script src="js/login.js" async></script>
<head>
    <meta charset="UTF-8">
    <title>PlaylistOnline</title>
</head>
<body>
<div class="centered-form">
    <h1>Login</h1>
    <form action = "#" method = "post" autocomplete="off">
        <label for="username" >Username:</label><br>
        <input type="text" id="username" name="username"><br>
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password"><br>
        <label for="passwordCopyInput" id="passwordCopyLabel" hidden>Confirm Password:</label><br>
        <input type="password" id="passwordCopyInput" name="passwordCopy" hidden><br>
        <br>
        <input class="button" type="submit" value="Sign in"><br>
    </form>
    <br>
    <span id="errorMessage"> </span>
    <a id="topButton" href="#" style="position: fixed; top: 10px; right: 10px;">
        <div class="button">Register</div>
    </a>
</div>
</body>
</html>
