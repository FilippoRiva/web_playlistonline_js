<!DOCTYPE html>
<html>
<link rel="stylesheet" type="text/css" href="css/home.css">
<head>
    <meta charset="UTF-8">
    <title>PlaylistOnline</title>
</head>
<body>
    <div class="logout" style="position:fixed; top: 10px; right: 10px">
        <form action = "/PlaylistOnlineJS/logout" method = "post">
            <input class="button" type="submit" value="Logout">
        </form>
    </div>

    <h1 class="username-playlists">Playlists</h1>

    <table class="playlist-table">
        <tr class="row">
            <td><a class="left" href="#">Playlist 1</a></td>
            <td><span class="right">0/00/0001</span></td>
        </tr>
    </table>


    <h1>Add a Song</h1>

    <form class="song-form" action = "#" method = "post" autocomplete="off"  enctype="multipart/form-data">
        <table>
            <tr class="row">
                <td><label class="left" for="s_title" >Title</label></td>
                <td><input class="right" type="text" id="s_title" name="s_title"></td>
            </tr>
            <tr class="row">
                <td><label class="left" for="s_genre" >Genre</label></td>
                <td>
                    <select class="right" id="s_genre" name="s_genre">
                        <option>choose an option</option>
                    </select>
                </td>
            </tr>
            <tr class="album-switch-container">
                <td class="album-switch">
                    <button class="button" type="submit" formaction="#">New Album</button>
                </td>
                <td class="album-switch">
                    <button class="button" type="submit" formaction="#">Existing Album</button>
                </td>
            </tr>
            <div hidden>
                <tr class="row">
                    <td><label class="left" for="ar_name">Artist</label></td>
                    <td><input class="right" type="text" id="ar_name" name="ar_name"></td>
                </tr>
                <tr class="row">
                    <td><label class="left" for="a_name">
                    <td><input class="right" type="text" id="a_name" name="a_name"></td>
                </tr>
                <tr class="row">
                    <td><label class="left" for="a_date">Release Date</label></td>
                    <td><input class="right" type="date" id="a_date" name="a_date"></td>
                </tr>
                <tr class="row">
                    <td><label class="left" for="a_cover">Cover</label></td>
                    <td><label class="button">Upload cover<input class="right" type="file"
                               id="a_cover"
                               name="a_cover"
                               accept="image/*"></label></td>
                </tr>
            </div>
            <div hidden>
                <tr class="row">
                    <td><label class="left" for="a_ID">Album</label></td>
                    <td><select class="right" id="a_ID" name="a_ID">
                        <option>options</option>
                    </select></td>
                </tr>
            </div>
            <div hidden>
                <tr class="row">
                    <td><div class="centered-text"> No albums available </div></td>
                    <td><input hidden name="a_ID"></td>
                </tr>
            </div>
        <div hidden>
            <tr class="row">
                <td><label class="left" for="s_file">Audio File</label></td>
                <td><label class="button">Upload File<input class="right" type="file" id="s_file" name="s_file"
                       accept="audio/*"></label></td>
            </tr>
            <tr class="row">
                <td><button class="button" type="submit">Add</button></td>
            </tr>
        </div>
        </table>
    </form>

    <h1>Create a Playlist</h1>

    <form class="playlist-form" action = "#" method = "post" autocomplete="off">
        <div class="row">
        <label class="left" for="p_title" >Title:</label>
        <input class="right" type="text" id="p_title" name="p_title"><br>
        </div>
        <div hidden>
            <br>You have no songs uploaded<br>
        </div>
        <table class="custom-table">
        <div hidden>
            <tr>
                <td class="artist-name">artist name</td>
                <td>
                    <table class="custom-table">
                        <tr>
                            <td class="album-title">album</td>
                            <td>
                                <table class="custom-table" >
                                    <tr>
                                        <td class="checkbox-container">
                                            <label>
                                                <input type="checkbox"><span class="song-title"></span>
                                            </label>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </div>
        </table>
        <input class="button" type="submit" value="Create">
    </form>

</body>
</html>
