<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<link rel="stylesheet" type="text/css" href="css/song.css">
<head>
    <meta charset="UTF-8">
    <title>PlaylistOnline</title>
</head>
<body>
    <div class="song-container">
        <div class="album-cover">
            <img src="/" th:src="@{/cover(aID=${song.album.id},arID=${song.album.artist.ID})}">
        </div>
        <div class="song-block">
            <div class="song-info">
                <div class="song-title" th:text="${song.title}"> song </div>
                <div class="artist-album" th:text="${song.album.artist.name}+' - '+${song.album.name}"> artists  </div>
                <div class="releaseDate-genre" th:text="${song.genre.name}+' - '+${song.album.date}">genre</div>
            </div>
            <div class="audio-player">
                <audio controls>
                    <source src="/" th:src="@{/songfile(arID=${song.album.artist.ID},aID=${song.album.id},id=${song.id})}">
                    No support
                </audio>
            </div>
        </div>
        <a th:href="@{/playlist(id=${param.p},page=${param.page})}">
        <div class="button" style="position: fixed; top:10px; right:10px">
            go back to playlist
        </div>
        </a>
    </div>
</body>
