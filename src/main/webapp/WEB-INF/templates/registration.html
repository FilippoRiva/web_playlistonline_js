<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<link rel="stylesheet" type="text/css" href="css/login.css">
<head>
    <meta charset="UTF-8">
    <title>PlaylistOnline</title>
</head>
<body>
<div class="centered-form">
    <h1>Registration</h1>
    <form action = "/PlaylistOnlineJS/registration" method = "post" autocomplete="off">
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" th:value="${param.username}"><br>
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" th:value="${param.password}"><br>
        <label for="passwordCopy">Confirm Password:</label><br>
        <input type="password" id="passwordCopy" name="passwordCopy" th:value="${param.passwordCopy}"><br>
        <br>
        <input class="button" type="submit" value="Register"><br>
    </form>
    <br>
    <span th:if="${usernameInvalid}">invalid username</span>
    <span th:if="${passwordInvalid}">invalid password</span>
    <span th:if="${passwordCopyInvalid}">password do not match</span>
    <span th:if="${usernameUnavailable}">username taken</span>
    <a href="/PlaylistOnlineJS/login" style="position: fixed; top: 10px; right: 10px;">
        <div class="button">
            login
        </div>
    </a>
</div>
</body>
</html>
